  # Where STATE above folds every condition into one word, this shows them
  # all: Scrubbed and its "Deleted N resources" live here, and so does the
  # message of a Progressing job that has not reached a verdict yet.
  - id: backups.conditions
    title: One k8up object's conditions, as the operator wrote them
    params:
      - name: kind
        short: "k8up kind: Backup, Check, Prune or Restore"
        required: true
      - name: name
        short: object name
        required: true
    source:
      # $kind reaches the script as a parameter, never templated into it, so
      # a value taken from cluster data cannot become shell code. The row
      # carries it capitalised ("Prune"), the API group wants it lower.
      script: |
        k=$(printf %s "$kind" | tr '[:upper:]' '[:lower:]')
        kubectl -n syn-cluster-backup get "$k.k8up.io" "$name" -o json
    # started and finished are not conditions, but they are the only thing
    # that speaks for an object k8up has not written a condition for yet.
    rows: >-
      [ {type: "started",  status: (.status.started // false | tostring),
         reason: "", message: "", lastTransitionTime: .metadata.creationTimestamp},
        {type: "finished", status: (.status.finished // false | tostring),
         reason: "", message: "", lastTransitionTime: ""} ]
      + [ .status.conditions[]? ]
      | .[]
    key: .type
    columns:
      - name: WHEN
        expr: .lastTransitionTime // ""
        format: timestamp
      - name: TYPE
        expr: .type
      # No emphasis: True is good on Completed and bad on nothing here —
      # Progressing True merely means it is still running.
      - name: STATUS
        expr: .status
      - name: REASON
        expr: .reason // ""
        emphasis: { Succeeded: good, Finished: good, Failed: bad }
      - name: MESSAGE
        expr: .message // ""
    sort:
      - by: WHEN
