# All things node related: the kubelet, scheduling, and the machine-config
# rollout — plus the pools that drive it.

rincewind: ">= 0.7.0"

views:
  # Port of the old builtin `nodes status`: kubelet, scheduling and
  # machine-config rollout. The CONFIG column judges a node against its
  # pool's rendered target — the state annotation alone reads "Done" on a
  # node the operator has not even told about a new config yet. That join
  # needs both nodes and pools, and the script does it in jq before the
  # columns ever see a row. Needs jq on the PATH; pools are best effort, so
  # the view keeps working on clusters without the MachineConfig operator.
  - id: nodes.status
    title: Kubelet, scheduling and machine-config rollout
    # Optional: empty lists every node, set it lists one pool's. The value
    # reaches the script as $selector, never templated into it, so a label
    # taken from cluster data cannot become shell code.
    params:
      - name: selector
        short: label selector, as kubectl -l takes it
    source:
      # pipefail is what lets the fetch stay a pipe: without it a kubectl
      # that cannot reach the cluster would hand jq an empty stdin, and the
      # view would draw an empty table as if the cluster had no nodes. With
      # it the pipeline fails where kubectl failed, in kubectl's own words.
      shell: [bash, -euo, pipefail, -c]
      script: |
        # Pools are best effort: on a cluster without the MachineConfig
        # operator there are none, and CONFIG then falls back to what the
        # node says about itself.
        pools=$(kubectl get machineconfigpools -o json 2>/dev/null) \
          || pools='{"items":[]}'
        # Use `if ... fi`, not `[ -n "$x" ] && ...`: the && form leaves exit
        # status 1 when the parameter is empty, which reads as a failure.
        # A declared parameter is always in the environment, empty when
        # nobody set it, so set -u has nothing to complain about here.
        if [ -n "$selector" ]; then set -- -l "$selector"; fi
        # The pools ride along as an argument, the nodes go down the pipe:
        # the nodes are the document that grows with the cluster, and an
        # argument list has a limit a pipe does not.
        kubectl get nodes "$@" -o json | jq --argjson pools "$pools" '
          # A pool covers a node when every label of its selector is on the
          # node. A pool that selects nothing covers nothing, not everything.
          def covers($labels):
            (.spec.nodeSelector.matchLabels // {})
            | length > 0 and all(to_entries[]; $labels[.key] == .value);

          # A node is normally covered by both "worker" and a custom pool,
          # and it is the custom one that is rolled out to it. "master"
          # outranks everything; between custom pools, the more specific
          # selector wins, and the name breaks the remaining tie.
          def pool_of($labels):
            [$pools.items[] | select(covers($labels))]
            | ( map(select(.metadata.name == "master"))[0]
                // ( map(select(.metadata.name | . != "master" and . != "worker"))
                     | sort_by([-(.spec.nodeSelector.matchLabels | length),
                                .metadata.name])[0] )
                // map(select(.metadata.name == "worker"))[0] );

          # One enriched node per stream value; the columns then only ever
          # look at their own row.
          .items[]
          | . + {poolTarget: (pool_of(.metadata.labels // {})
                              | .status.configuration.name // "")}
        '
    rows: .
    key: .metadata.name
    columns:
      - name: NAME
        expr: .metadata.name
      - name: ROLE
        expr: >-
          [(.metadata.labels // {}) | keys[]
           | select(startswith("node-role.kubernetes.io/"))
           | ltrimstr("node-role.kubernetes.io/")
           | select(. != "")] | sort | join(",")
      # A node whose Ready condition is missing entirely still gets a row.
      - name: READY
        expr: >-
          [.status.conditions[]? | select(.type == "Ready")][0] as $c
          | if $c == null then "Unknown"
            elif $c.status == "True" then "Ready"
            elif $c.status == "False" then "NotReady"
            else "Unknown" end
        emphasis: { Ready: good, NotReady: bad, Unknown: bad }
      # An absolute timestamp rather than an age: this column exists to be
      # lined up against job start times and log lines, and "4h59m" cannot.
      - name: SINCE
        expr: >-
          [.status.conditions[]? | select(.type == "Ready")][0].lastTransitionTime // ""
        format: timestamp
      - name: SCHED
        expr: if .spec.unschedulable then "cordoned" else "" end
        emphasis: { cordoned: warn }
      # "pending": told to change, has not finished. "behind": not told yet,
      # the pool has moved on without it.
      - name: CONFIG
        expr: >-
          (.metadata.annotations // {}) as $a
          | ($a["machineconfiguration.openshift.io/state"] // "") as $state
          | ($a["machineconfiguration.openshift.io/currentConfig"] // "") as $cur
          | ($a["machineconfiguration.openshift.io/desiredConfig"] // "") as $desired
          | if $state == "Degraded" or $state == "Working" then $state
            elif $cur == "" then $state
            elif $desired != "" and $cur != $desired then "pending"
            elif .poolTarget != "" and $cur != .poolTarget then "behind"
            else $state end
        emphasis: { Degraded: bad, Working: warn, pending: warn, behind: warn, Done: good }
      - name: VERSION
        expr: .status.nodeInfo.kubeletVersion
      # The operator's reason when the rollout is unhappy: "failed to drain
      # node" beats "kubelet is posting ready status" as an explanation.
      - name: MESSAGE
        expr: >-
          (.metadata.annotations // {}) as $a
          | ($a["machineconfiguration.openshift.io/reason"] // "") as $reason
          | if ($a["machineconfiguration.openshift.io/state"] == "Degraded" and $reason != "")
            then $reason
            else ([.status.conditions[]? | select(.type == "Ready")][0].message // "") end
    # Trouble first: broken kubelet, then a struggling rollout, then merely
    # cordoned; within a class the most recent change at the bottom.
    sort:
      - by: READY
        rank: [NotReady, Unknown, Ready]
      - by: CONFIG
        rank: [Degraded, Working, pending, behind]
      - by: SCHED
        rank: [cordoned]
      - by: SINCE
        order: asc
      - by: NAME
    actions:
      - key: enter
        name: conditions
        short: Show this node's conditions
        open: nodes.conditions
        args:
          node: .metadata.name
      - key: m
        name: config
        short: Show this node's machine-config rollout
        open: nodes.config
        args:
          node: .metadata.name

      # Cordon only stops new pods landing; it does not move the ones already
      # there. Saying so is the difference between this and a drain, which
      # this tool deliberately does not offer.
      - key: c
        name: cordon
        short: Stop scheduling
        confirm: >-
          "Stop scheduling on \(map(.metadata.name) | join(", "))" +
          "\n\nRunning pods stay where they are; this only stops new ones landing."
        env:
          node: .metadata.name
        script: |
          kubectl --as system:admin patch node "$node" \
            --type merge -p '{"spec":{"unschedulable":true}}'
        reload: true

      - key: C
        name: uncordon
        short: Allow scheduling
        confirm: '"Allow scheduling on \(map(.metadata.name) | join(", "))"'
        env:
          node: .metadata.name
        script: |
          kubectl --as system:admin patch node "$node" \
            --type merge -p '{"spec":{"unschedulable":null}}'
        reload: true

  # MachineConfigPools, and the drill-down into the nodes one covers. This is
  # what actions are for: `open` navigates, `script` works, and both derive
  # what they need from the row with jq.
  - id: nodes.pools
    title: MachineConfigPools and their rollout
    source:
      script: kubectl get machineconfigpools -o json
    rows: .items[]
    key: .metadata.name
    columns:
      - name: NAME
        expr: .metadata.name
      - name: PAUSED
        expr: if .spec.paused then "paused" else "" end
        emphasis: { paused: warn }
      - name: STATE
        expr: >-
          [.status.conditions[]? | select(.status == "True") | .type] as $on
          | if ($on | index("Degraded")) then "Degraded"
            elif ($on | index("Updating")) then "Updating"
            elif ($on | index("Updated")) then "Updated"
            else "Unknown" end
        emphasis: { Degraded: bad, Updating: warn, Updated: good, Unknown: warn }
      - name: READY
        expr: '"\(.status.readyMachineCount // 0)/\(.status.machineCount // 0)"'
      - name: TARGET
        expr: .status.configuration.name // ""
      - name: MESSAGE
        expr: >-
          [.status.conditions[]? | select(.type == "Degraded" and .status == "True")][0].message // ""
    sort:
      - by: STATE
        rank: [Degraded, Updating, Updated]
      - by: NAME
    actions:
      # Navigate: the chain one actually walks — the pool is stuck, which
      # node is holding it up. Acts on the row under the cursor.
      - key: enter
        name: nodes
        short: Show the nodes in this pool
        open: nodes.status
        args:
          # Rendering only the matchLabels half of a selector that also has
          # matchExpressions would list the wrong nodes, which is worse than
          # saying no. The refusal travels as the tab's error.
          selector: >-
            if ((.spec.nodeSelector.matchExpressions // []) | length) > 0
            then error("pool \(.metadata.name) selects nodes by expression, which this view cannot render; use kubectl")
            elif ((.spec.nodeSelector.matchLabels // {}) | length) == 0
            then error("pool \(.metadata.name) has no node selector")
            else (.spec.nodeSelector.matchLabels | to_entries | sort_by(.key)
                  | map("\(.key)=\(.value)") | join(","))
            end

      # The same selector, charted: CPU and memory per node in this pool
      # over a week — c and C pair the way cordon and uncordon do above.
      - key: t
        name: cpu
        short: Chart CPU per node in this pool, 1w
        open: nodes.cpu
        args:
          selector: >-
            if ((.spec.nodeSelector.matchExpressions // []) | length) > 0
            then error("pool \(.metadata.name) selects nodes by expression, which this view cannot render; use kubectl")
            elif ((.spec.nodeSelector.matchLabels // {}) | length) == 0
            then error("pool \(.metadata.name) has no node selector")
            else (.spec.nodeSelector.matchLabels | to_entries | sort_by(.key)
                  | map("\(.key)=\(.value)") | join(","))
            end

      - key: T
        name: memory
        short: Chart memory per node in this pool, 1w
        open: nodes.memory
        args:
          selector: >-
            if ((.spec.nodeSelector.matchExpressions // []) | length) > 0
            then error("pool \(.metadata.name) selects nodes by expression, which this view cannot render; use kubectl")
            elif ((.spec.nodeSelector.matchLabels // {}) | length) == 0
            then error("pool \(.metadata.name) has no node selector")
            else (.spec.nodeSelector.matchLabels | to_entries | sort_by(.key)
                  | map("\(.key)=\(.value)") | join(","))
            end

      # Work: runs once per selected row. Select with ␣ or a first — a
      # mutation never acts on merely what the filter left.
      - key: p
        name: pause
        short: Pause the rollout
        confirm: '"Pause the rollout of \(map(.metadata.name) | join(", "))"'
        env:
          name: .metadata.name
        script: |
          kubectl patch machineconfigpool "$name" --type merge \
            -p '{"spec":{"paused":true}}'
        reload: true

      - key: P
        name: resume
        short: Resume the rollout
        confirm: '"Resume the rollout of \(map(.metadata.name) | join(", "))"'
        env:
          name: .metadata.name
        script: |
          kubectl patch machineconfigpool "$name" --type merge \
            -p '{"spec":{"paused":false}}'
        reload: true

  # Where the READY column above folds the kubelet's verdict into one word,
  # this shows every condition — DiskPressure and MemoryPressure live here,
  # and they are what one word cannot say.
  - id: nodes.conditions
    title: One node's conditions, as the kubelet wrote them
    params:
      - name: node
        short: node name
        required: true
    source:
      script: kubectl get nodes "$node" -o json
    rows: .status.conditions[]?
    key: .type
    columns:
      - name: WHEN
        expr: .lastTransitionTime // ""
        format: timestamp
      - name: TYPE
        expr: .type
      # No emphasis: True is good on Ready and bad on DiskPressure.
      - name: STATUS
        expr: .status
      - name: REASON
        expr: .reason // ""
      - name: MESSAGE
        expr: .message // ""
    sort:
      - by: WHEN
    actions:
      - key: m
        name: config
        short: Show this node's machine-config rollout
        open: nodes.config
        args:
          node: $args.node

  # The rendered config names are far too long for a list, and are exactly
  # what one compares against the pool when a rollout is stuck.
  - id: nodes.config
    title: One node's machine-config rollout in full
    params:
      - name: node
        short: node name
        required: true
    source:
      shell: [bash, -euo, pipefail, -c]
      script: |
        # Pools are best effort, and the join is the one nodes.status
        # makes; the two views must agree on it, or the list and the
        # drill-down would disagree about the same node.
        pools=$(kubectl get machineconfigpools -o json 2>/dev/null) \
          || pools='{"items":[]}'
        kubectl get nodes "$node" -o json | jq --argjson pools "$pools" '
          def covers($labels):
            (.spec.nodeSelector.matchLabels // {})
            | length > 0 and all(to_entries[]; $labels[.key] == .value);

          def pool_of($labels):
            [$pools.items[] | select(covers($labels))]
            | ( map(select(.metadata.name == "master"))[0]
                // ( map(select(.metadata.name | . != "master" and . != "worker"))
                     | sort_by([-(.spec.nodeSelector.matchLabels | length),
                                .metadata.name])[0] )
                // map(select(.metadata.name == "worker"))[0] );

          . as $n
          | pool_of($n.metadata.labels // {}) as $pool
          | ($n.metadata.annotations // {}) as $a
          | ($a["machineconfiguration.openshift.io/state"] // "") as $state
          | ($a["machineconfiguration.openshift.io/currentConfig"] // "") as $cur
          | ($a["machineconfiguration.openshift.io/desiredConfig"] // "") as $desired
          | ($pool.status.configuration.name // "") as $target
          | [ {what: "state",
               value: (if $state == "Degraded" or $state == "Working" then $state
                       elif $cur == "" then $state
                       elif $desired != "" and $cur != $desired then "pending"
                       elif $target != "" and $cur != $target then "behind"
                       else $state end)},
              {what: "pool",         value: ($pool.metadata.name // "")},
              {what: "pool target",  value: $target},
              {what: "node desired", value: $desired},
              {what: "node current", value: $cur},
              {what: "annotation",   value: $state},
              {what: "reason",       value: ($a["machineconfiguration.openshift.io/reason"] // "")},
              {what: "schedulable",  value: (if $n.spec.unschedulable then "no" else "yes" end)} ]
          | .[]
        '
    rows: .
    key: .what
    columns:
      - name: WHAT
        expr: .what
      - name: VALUE
        expr: .value
        emphasis: { Degraded: bad, Working: warn, pending: warn, behind: warn, Done: good, "no": warn }
    actions:
      - key: enter
        name: conditions
        short: Show this node's conditions
        open: nodes.conditions
        args:
          node: $args.node
