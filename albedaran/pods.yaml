# Pods that need attention: everything that is neither Running nor Completed
# — and, when asked for, every pod beside them.

rincewind: ">= 0.7.0"

views:
  # The filter lives in `rows`, not in the columns: the state a pod shows in
  # `kubectl get pods` is not the phase alone — a pod whose phase is Running
  # can be stuck in CrashLoopBackOff, and phase Succeeded prints as
  # Completed. So the state is derived once, kubectl-style, attached to the
  # row, and both the filter and the STATE column read that one verdict.
  - id: pods.status
    title: Pods that need attention, or every pod when asked
    params:
      # The filter, not a different view: "all" keeps the columns, the
      # colours and the sort, and only stops throwing the healthy rows away.
      # A drill-down that wants to show what a selector picks needs to be
      # able to show that it picks nothing, which the default cannot.
      - name: show
        short: failed or all
        default: failed
      # Optional: empty searches every namespace.
      - name: namespace
        short: namespace, empty for all
      - name: selector
        short: label selector, as kubectl -l takes it
    source:
      # Use `if ... fi`, not `[ -n "$x" ] && ...`: the && form leaves exit
      # status 1 when the parameter is empty, which reads as a failure.
      script: |
        if [ -n "$selector" ]; then set -- -l "$selector"; fi
        if [ -n "$namespace" ]; then
          kubectl -n "$namespace" get pods "$@" -o json
        else
          kubectl get pods -A "$@" -o json
        fi
    # Deletion wins, then the pod-level reason (Evicted, NodeLost), then the
    # first unhappy init container, then the first waiting container reason,
    # then the phase. That is the order kubectl prints, minus its exhaustive
    # corner cases — close enough that the words on screen match `get pods`.
    # A parameter's default reaches the script as an environment variable,
    # but not $args here — an expression sees exactly what was passed, and
    # null when nothing was. So the default is repeated, and an empty value
    # is read as absent, the way the script side would read it.
    rows: >-
      (if ($args.show // "") == "" then "failed" else $args.show end) as $show
      | (if $show == "failed" or $show == "all" then .
         else error("show takes failed or all, not \"\($show)\"") end)
      | .items[]
      | ( if .metadata.deletionTimestamp != null then "Terminating"
          elif (.status.reason // "") != "" then .status.reason
          else
            ( [ .status.initContainerStatuses[]?
                | (.state.waiting.reason
                   // (if (.state.terminated.exitCode // 0) != 0 then "Error" else null end)) ]
              | map(select(. != null)) | first ) as $init
            | ( [ .status.containerStatuses[]? | .state.waiting.reason ]
                | map(select(. != null)) | first ) as $wait
            | if $init != null then "Init:\($init)"
              elif $wait != null then $wait
              elif .status.phase == "Succeeded" then "Completed"
              else (.status.phase // "Unknown") end
          end ) as $state
      | select($show == "all" or ($state != "Running" and $state != "Completed"))
      | . + {state: $state}
    key: '"\(.metadata.namespace)/\(.metadata.name)"'
    columns:
      - name: NAMESPACE
        expr: .metadata.namespace
      - name: NAME
        expr: .metadata.name
      # Every row here is trouble by construction; the colours only grade it.
      # The list of reasons is open-ended, so states outside this map simply
      # stay plain — which still reads as "not good".
      - name: STATE
        expr: .state
        emphasis:
          CrashLoopBackOff: bad
          ImagePullBackOff: bad
          ErrImagePull: bad
          CreateContainerConfigError: bad
          CreateContainerError: bad
          "Init:CrashLoopBackOff": bad
          "Init:ImagePullBackOff": bad
          "Init:ErrImagePull": bad
          "Init:Error": bad
          Error: bad
          Failed: bad
          Evicted: bad
          OOMKilled: bad
          Unknown: bad
          Pending: warn
          ContainerCreating: warn
          PodInitializing: warn
          Terminating: warn
      - name: READY
        expr: >-
          "\([.status.containerStatuses[]? | select(.ready)] | length)/\(.spec.containers | length)"
      - name: RESTARTS
        expr: '[.status.containerStatuses[]?.restartCount] | add // 0 | tostring'
      # An absolute timestamp rather than an age: this column exists to be
      # lined up against events and log lines, and "4h59m" cannot. Falls
      # back to creation for a pod that never started.
      - name: SINCE
        expr: .status.startTime // .metadata.creationTimestamp // ""
        format: timestamp
      - name: NODE
        expr: .spec.nodeName // ""
      # The most specific explanation available: what a waiting container
      # says about itself ("back-off 5m restarting failed container..."),
      # then the pod's own message (evictions), then the message of an
      # unhappy pod condition ("0/3 nodes are available...").
      - name: MESSAGE
        expr: >-
          ( [ .status.containerStatuses[]?, .status.initContainerStatuses[]?
              | .state.waiting.message ] | map(select(. != null)) | first )
          // .status.message
          // ( [ .status.conditions[]? | select(.status == "False") | .message ]
               | map(select(. != null)) | first )
          // ""
    # The most recent change at the bottom: the pod that just went wrong is
    # the one being looked for. No state ranking — the reasons are open-ended,
    # so an unlisted one would sort as though it were fine. Colour carries it
    # instead, which is also what makes `show: all` readable: Running and
    # Completed are the two states with no emphasis, so the healthy rows are
    # the plain ones.
    sort:
      - by: SINCE
        order: asc
      - by: NAMESPACE
      - by: NAME
    actions:
      # Work: runs once per selected row. Select with ␣ or a first — a
      # mutation never acts on merely what the filter left.
      #
      # Whether the pod comes back depends on who owns it: a Deployment's or
      # StatefulSet's pod is recreated and effectively restarted, a bare pod
      # is gone for good. Saying which is on the table is the difference
      # between a restart and a delete. `x` closes a tab, so delete takes `d`.
      - key: d
        name: delete
        short: Delete this pod
        confirm: >-
          "Delete \(map("\(.metadata.namespace)/\(.metadata.name)") | join(", "))" +
          (if any(.[]; ((.metadata.ownerReferences // []) | length) == 0)
           then "\n\nSome of these have no owner — nothing will recreate them."
           else "\n\nEach one is owned by a controller, which will recreate it." end)
        env:
          namespace: .metadata.namespace
          name: .metadata.name
        script: |
          kubectl --as system:admin -n "$namespace" delete pod "$name"
        reload: true

  # A disruption budget is the thing that stops a drain, so it is read when a
  # node will not empty. Most of them are fine and say nothing here; the ones
  # with a word in STATE are the reason the view exists.
  - id: pods.pdb
    title: Pod disruption budgets, and which of them will not let go
    refresh: 30s
    params:
      - name: namespace
        short: namespace, empty for all
    source:
      script: |
        if [ -n "$namespace" ]; then
          kubectl -n "$namespace" get poddisruptionbudgets -o json
        else
          kubectl get poddisruptionbudgets -A -o json
        fi
    rows: .items[]
    key: '"\(.metadata.namespace)/\(.metadata.name)"'
    columns:
      - name: NAMESPACE
        expr: .metadata.namespace
      - name: NAME
        expr: .metadata.name
      # Whichever of the two was set, printed as written: either can be a
      # percentage, and 25% is worth seeing as 25% rather than resolved.
      - name: BUDGET
        expr: >-
          if .spec.minAvailable != null then "min \(.spec.minAvailable)"
          elif .spec.maxUnavailable != null then "max \(.spec.maxUnavailable)"
          else "" end
      # Healthy against selected, kubectl-style. The right-hand number is the
      # whole question when a budget selects nothing.
      - name: HEALTHY
        expr: '"\(.status.currentHealthy // 0)/\(.status.expectedPods // 0)"'
      - name: NEEDS
        expr: .status.desiredHealthy // 0
      - name: ALLOWED
        expr: .status.disruptionsAllowed // 0
      # The verdict, and the reason for the view. Empty when there is nothing
      # to say — the numbers beside it already say it — so that a word here
      # is always a problem.
      #
      # "selects nothing" comes first because it makes the rest meaningless:
      # with no pods selected, nothing is blocked either. Then the one
      # distinction that decides what to do about it — every selected pod is
      # healthy and the budget still permits no disruption, so it is the spec
      # that will not allow a drain, not a pod that has yet to come back.
      - name: STATE
        expr: >-
          (.status // {}) as $s
          | ($s.expectedPods // 0) as $expected
          | ($s.currentHealthy // 0) as $healthy
          | if any($s.conditions[]?; .reason == "SyncFailed") then "SyncFailed"
            elif ($s.observedGeneration // 0) != (.metadata.generation // 0) then "stale"
            elif $expected == 0 then "selects nothing"
            elif ($s.disruptionsAllowed // 0) > 0 then ""
            elif $healthy >= $expected then "unsatisfiable"
            else "blocks drain" end
        emphasis:
          { SyncFailed: bad, unsatisfiable: bad, "blocks drain": bad,
            "selects nothing": warn, stale: warn }
      - name: SINCE
        expr: '([.status.conditions[]?.lastTransitionTime] | sort | last) // ""'
        format: timestamp
      - name: MESSAGE
        expr: '[.status.conditions[]? | select((.message // "") != "")][0].message // ""'
    # The spec's own faults first, then what merely waits on a pod. A budget
    # with nothing to say sinks to the bottom, being unranked. Within a class
    # the most recent at the bottom.
    sort:
      - by: STATE
        rank: [SyncFailed, unsatisfiable, "blocks drain", "selects nothing", stale]
      - by: SINCE
    actions:
      # Every number in the row is counted over the pods this selector picks,
      # so that is where an explanation is. The selector is rewritten as
      # kubectl takes it — matchLabels as k=v, matchExpressions as the
      # set-based forms — and an empty selector stays empty, which is exactly
      # what it means: every pod in the namespace.
      # `j` is taken by the cursor, so the ticket gets `t`. No selection to
      # honour: a navigating action only ever sees the row under the cursor,
      # and the report is about the cluster rather than about a row — it
      # filters itself down to the budgets with something to say.
      - key: t
        name: report
        short: Write the budgets in the way up for a ticket
        open: pods.pdbreport
        args:
          include: '"problems"'

      - key: enter
        name: pods
        short: Show the pods this budget counts
        open: pods.status
        args:
          # Every pod, not only the unhappy ones: a budget that selects
          # nothing has to look different from one whose pods are all fine,
          # and under the default both are an empty table.
          show: '"all"'
          namespace: .metadata.namespace
          selector: >-
            (.spec.selector // {}) as $s
            | (($s.matchLabels // {}) | to_entries | map("\(.key)=\(.value)"))
              + (($s.matchExpressions // []) | map(
                  if .operator == "In" then "\(.key) in (\(.values | join(",")))"
                  elif .operator == "NotIn" then "\(.key) notin (\(.values | join(",")))"
                  elif .operator == "Exists" then .key
                  elif .operator == "DoesNotExist" then "!\(.key)"
                  else error("selector operator \(.operator) is not one kubectl -l can take") end))
            | join(",")

  # The same table as pods.pdb, written for somewhere else: a ticket. Not
  # listed, because `include` is required — a view that needs a parameter
  # cannot be started from the menu, which is how a hat hides one.
  #
  # No refresh: a report carries the moment it was taken, and one that
  # rewrote itself under the cursor would make that line a lie.
  #
  # The verdict below is pods.pdb's, said again. There is no way for one view
  # to borrow another's expression, and a report that disagreed with the
  # table it came from would be worse than the repetition.
  - id: pods.pdbreport
    title: Pod disruption budgets, written up for a ticket
    params:
      # One legal value. The param earns its keep by being required — that
      # is what keeps the view out of the menu.
      - name: include
        short: problems, the only value
        required: true
    class: text
    # Markdown, because Jira Cloud stores issues as ADF and takes Markdown on
    # paste. Wiki markup is what Data Center speaks and what the new cloud
    # editor refuses, and it is not written here: this hat wears one hat.
    source:
      script: |
        case "$include" in problems) ;;
          *) echo "include takes problems, not \"$include\"" >&2; exit 1 ;;
        esac

        kubectl get poddisruptionbudgets -A -o json | jq -r \
          --arg cluster "$(kubectl config current-context)" \
          --arg taken "$(date -u '+%Y-%m-%d %H:%M UTC')" '
          def budget:
            if .spec.minAvailable != null then "min \(.spec.minAvailable)"
            elif .spec.maxUnavailable != null then "max \(.spec.maxUnavailable)"
            else "none" end;
          def state:
            (.status // {}) as $s
            | ($s.expectedPods // 0) as $expected
            | ($s.currentHealthy // 0) as $healthy
            | if any($s.conditions[]?; .reason == "SyncFailed") then "SyncFailed"
              elif ($s.observedGeneration // 0) != (.metadata.generation // 0) then "stale"
              elif $expected == 0 then "selects nothing"
              elif ($s.disruptionsAllowed // 0) > 0 then "ok"
              elif $healthy >= $expected then "unsatisfiable"
              else "blocks drain" end;
          # The same shortening the timestamp format does in the table, so
          # a report and the view it came from say the time alike. (No
          # apostrophes in here: the whole program is one shell-quoted
          # string, and one would end it.)
          def when:
            (. // "") | if . == "" then "" else (.[0:16] | sub("T"; " ")) end;
          # A newline or a pipe in a message would end the row it sits in.
          def cell:
            (. // "" | tostring) | gsub("[\r\n]+"; " ") | gsub("\\|"; "\\|");
          def row($cells): "| " + ($cells | map(cell) | join(" | ")) + " |";

          [ .items[]
            | { ns: .metadata.namespace, name: .metadata.name, budget: budget,
                healthy: "\(.status.currentHealthy // 0)/\(.status.expectedPods // 0)",
                allowed: (.status.disruptionsAllowed // 0),
                state: state,
                since: (([.status.conditions[]?.lastTransitionTime] | sort | last) | when),
                message: ([.status.conditions[]? | select((.message // "") != "")][0].message // "") }
            | select(.state != "ok") ] as $rows
          | ["Namespace", "Name", "Budget", "Healthy", "Allowed", "State", "Since"] as $head

          | "## Problem",
            "",
            "* Cluster: \($cluster)",
            "* Timestamp: \($taken)",
            "",
            "The following pod disruption budgets are invalid and may block the next maintenance.",
            "",
            ( if ($rows | length) == 0
              then "No budget is in the way."
              else row($head), row($head | map("---")),
                   ( $rows[] | row([.ns, .name, .budget, .healthy, .allowed, .state, .since]) )
              end ),
            ( [$rows[] | select(.message != "")] as $noted
              | if ($noted | length) == 0 then empty
                else "", "### Messages", "",
                     ($noted[] | "* \(.ns)/\(.name): \(.message | cell)")
                end )
          '
